name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * *"

concurrency:
  group: update-flake-lock

jobs:
  update-flake-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: accept-flake-config = true
      - name: Update nixos-unstable and dependency hashes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix flake update nixpkgs
          if ! git diff --quiet -- flake.lock; then
            nix develop -c ./scripts/update-releases all --refresh
          fi
      - name: Open or update the Nixpkgs pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.T3CODE_UPDATE_TOKEN }}
          branch: automation/update-flake-lock
          delete-branch: false
          commit-message: "chore: update nixos-unstable"
          title: "chore: update nixos-unstable"
          body: |
            Updates Nixpkgs to the latest nixos-unstable revision and refreshes
            the stable and nightly release dependency hashes with its toolchains.

            CI merges this update only after evaluation and all package checks pass.
          labels: dependencies,automated
